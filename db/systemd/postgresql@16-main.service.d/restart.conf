# /etc/systemd/system/postgresql@16-main.service.d/restart.conf on the VPS.
#
# On 2026-10-22 the disk filled, PostgreSQL stopped, and its one restart
# attempt failed because the disk was still full. Space came back later; the
# database did not, because the stock unit never retries. It stayed down for
# twelve days.
#
# With this, a failed start is retried every 30 s, so the database returns by
# itself once the cause is gone. 30 s spacing never trips systemd's default
# start limit (5 starts in 10 s).
#
# Install: sudo install -D -m 0644 restart.conf \
#            /etc/systemd/system/postgresql@16-main.service.d/restart.conf
#          sudo systemctl daemon-reload
[Service]
Restart=on-failure
RestartSec=30s
