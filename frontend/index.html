    <meta name="theme-color" content="#020617" />
    <link rel="canonical" href="https://hunajapannu.fi/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hunajapannu.fi/" />
    <meta property="og:site_name" content="Hunajapannu" />
    <meta property="og:title" content="Hunajapannu — live SSH honeypot dashboard" />
    <meta
      property="og:description"
      content="Real attacks against a Raspberry Pi honeypot, live: attacker session timelines, MITRE ATT&amp;CK-tagged commands, credentials and malware samples."

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hunajapannu — live SSH honeypot dashboard" />

      name="twitter:description"
      content="Real attacks against a Raspberry Pi honeypot, live: attacker session timelines, MITRE ATT&amp;CK-tagged commands, credentials and malware samples."

    <div id="root"></div>
    <noscript>
      <div
        style="
          min-height: 100vh;
          background: #000;
          color: #6ee7b7;
          font-family: ui-monospace, monospace;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem;

        "
      >
        <div>
          <h1 style="color: #86efac">hunajapannu.fi</h1>

          <p style="font-size: 0.85rem; color: #34d399">
            The data itself is available without it, from the public JSON API at
            <code>/api/public/cowrie/</code>.
          </p>
        </div>
      </div>

    <script type="module" src="/src/main.jsx"></script>
