<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Attack pipeline: botnets reach a Cowrie honeypot on a Raspberry Pi in Finland, a forwarder ships events over HTTPS to an Express API on a VPS, which stores them in PostgreSQL and serves a public dashboard through nginx.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <style>
      .zone  { fill:none; stroke:#065f46; stroke-width:1.5; stroke-dasharray:5 5; }
      .zlbl  { fill:#34d399; font:600 11px ui-monospace,"SFMono-Regular",Menlo,monospace; letter-spacing:.14em; }
      .node  { fill:#020617; stroke:#34d399; stroke-width:1.75; }
      .accent{ fill:#022c22; stroke:#6ee7b7; stroke-width:2; }
      .name  { fill:#d1fae5; font:600 14px ui-monospace,"SFMono-Regular",Menlo,monospace; }
      .sub   { fill:#6ee7b7; font:11.5px ui-monospace,"SFMono-Regular",Menlo,monospace; }
      .flow  { stroke:#34d399; stroke-width:2; fill:none; marker-end:url(#a); }
      .elbl  { fill:#a7f3d0; font:11px ui-monospace,"SFMono-Regular",Menlo,monospace; }
      .emut  { fill:#34d399; font:10px ui-monospace,"SFMono-Regular",Menlo,monospace; opacity:.85; }
    </style>
  </defs>

  <!-- solid background so the diagram stays readable when shown outside the dark dashboard (e.g. GitHub light mode) -->
  <rect width="1280" height="400" rx="12" fill="#020617"/>

  <!-- zones -->
  <rect class="zone" x="240" y="44" width="496" height="150" rx="10"/>
  <text class="zlbl" x="252" y="36">HOME · FINLAND · RESIDENTIAL BROADBAND</text>

  <rect class="zone" x="792" y="44" width="222" height="286" rx="10"/>
  <text class="zlbl" x="804" y="36">VPS</text>

  <!-- ingest row -->
  <rect class="node" x="24"  y="84" width="160" height="70" rx="8"/>
  <text class="name" x="104" y="114" text-anchor="middle">Botnets</text>
  <text class="sub"  x="104" y="133" text-anchor="middle">29,333 IPs</text>

  <rect class="accent" x="254" y="76" width="212" height="86" rx="8"/>
  <text class="name" x="360" y="106" text-anchor="middle">Raspberry Pi</text>
  <text class="sub"  x="360" y="125" text-anchor="middle">Cowrie honeypot</text>
  <text class="sub"  x="360" y="143" text-anchor="middle">:22 · :2222</text>

  <rect class="node" x="536" y="76" width="190" height="86" rx="8"/>
  <text class="name" x="631" y="106" text-anchor="middle">forwarder.py</text>
  <text class="sub"  x="631" y="125" text-anchor="middle">systemd, hardened</text>
  <text class="sub"  x="631" y="143" text-anchor="middle">at-least-once</text>

  <rect class="accent" x="806" y="76" width="194" height="86" rx="8"/>
  <text class="name" x="903" y="106" text-anchor="middle">Express 5</text>
  <text class="sub"  x="903" y="125" text-anchor="middle">ingest + public API</text>
  <text class="sub"  x="903" y="143" text-anchor="middle">:3001 · pm2</text>

  <rect class="node" x="806" y="236" width="194" height="72" rx="8"/>
  <text class="name" x="903" y="266" text-anchor="middle">PostgreSQL 16</text>
  <text class="sub"  x="903" y="285" text-anchor="middle">8.07M events</text>

  <rect class="node" x="1070" y="76" width="186" height="86" rx="8"/>
  <text class="name" x="1163" y="106" text-anchor="middle">nginx</text>
  <text class="sub"  x="1163" y="125" text-anchor="middle">TLS :443</text>
  <text class="sub"  x="1163" y="143" text-anchor="middle">React dashboard</text>

  <!-- flows -->
  <path class="flow" d="M184,119 H246"/>
  <text class="elbl" x="211" y="104" text-anchor="middle">SSH</text>

  <path class="flow" d="M466,119 H528"/>
  <text class="elbl" x="497" y="104" text-anchor="middle">tail</text>

  <path class="flow" d="M726,119 H798"/>
  <text class="elbl" x="764" y="104" text-anchor="middle">POST</text>

  <path class="flow" d="M1000,119 H1062"/>

  <!-- api <-> db -->
  <path class="flow" d="M885,162 V228"/>
  <path class="flow" d="M921,228 V166"/>
  <text class="emut" x="903" y="322" text-anchor="middle">triggers maintain the aggregates</text>

  <text class="emut" x="360" y="182" text-anchor="middle">writes cowrie.json</text>
  <text class="emut" x="631" y="182" text-anchor="middle">offset saved only on HTTP 200</text>

  <!-- footnote -->
  <text class="emut" x="24" y="362">Backend downtime delays events rather than dropping them. Batches the API permanently rejects are parked on the Pi</text>
  <text class="emut" x="24" y="378">and replayed by a separate unit, so one bad payload cannot stall the pipeline.</text>
</svg>
