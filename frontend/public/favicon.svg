<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A honey pot with a shell prompt cut out of it: hunajapannu is Finnish
       for honey pot, and what this one catches is typed into a terminal.
       Constructed, not drawn: the body is one circle (r 15.5) cut flat at the
       opening and the base, the rim is a 26-unit bar a fixed gap above it,
       and a 1.6 stroke of the fill colour gives every corner the same small
       radius. The prompt is a mask, so the tab shows through it. Darker
       amber on light tab bars, where the bright gold washes out. -->
  <style>
    .pot { fill: #d97706; stroke: #d97706; }
    @media (prefers-color-scheme: dark) { .pot { fill: #f5b335; stroke: #f5b335; } }
  </style>
  <mask id="cut">
    <rect width="48" height="48" fill="#fff"/>
    <path d="M17.2 22.6l4.8 4.2-4.8 4.2M25.6 31h5.6" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <g class="pot" stroke-width="1.6" stroke-linejoin="round" mask="url(#cut)">
    <rect x="11" y="7.6" width="26" height="4" rx="1.2"/>
    <path d="M13.29 15H34.71A15.5 15.5 0 0 1 31.44 39.8H16.56A15.5 15.5 0 0 1 13.29 15Z"/>
  </g>
</svg>
