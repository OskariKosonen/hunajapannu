<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- A honey pot with a shell prompt cut out of it: hunajapannu is Finnish
       for honey pot, and what this one catches is typed into a terminal.
       The prompt is a mask, not paint, so the tab shows through it. Darker
       amber on light tab bars, where the bright gold washes out. -->
  <style>
    .pot { fill: #d97706; }
    @media (prefers-color-scheme: dark) { .pot { fill: #f5b335; } }
  </style>
  <mask id="prompt">
    <rect width="24" height="24" fill="#fff"/>
    <path d="M8.4 12.3l2.7 2.3-2.7 2.3M12.9 16.9h3.1" fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <g class="pot" mask="url(#prompt)">
    <path d="M6.4 2.8h11.2a1.6 1.6 0 0 1 0 3.2H6.4a1.6 1.6 0 0 1 0-3.2Z"/>
    <path d="M8.3 6.9h7.4c0 .9.5 1.4 1.4 1.9 2.4 1.3 3.7 3.5 3.7 6.2 0 4-3.6 6.8-8.8 6.8s-8.8-2.8-8.8-6.8c0-2.7 1.3-4.9 3.7-6.2.9-.5 1.4-1 1.4-1.9Z"/>
  </g>
</svg>
