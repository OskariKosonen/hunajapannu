<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- A honey drop with a shell prompt knocked out of it: hunajapannu is
       Finnish for honey pot, and what it catches is typed into a terminal.
       The prompt is a mask, not paint, so it shows the tab behind it. The
       drop darkens on light tab bars, where the bright emerald washes out. -->
  <style>
    .mark { fill: #059669; }
    @media (prefers-color-scheme: dark) { .mark { fill: #34d399; } }
  </style>
  <mask id="prompt">
    <path d="M12 1.6C9.7 5 3.8 10.4 3.8 15a8.2 8.2 0 0 0 16.4 0C20.2 10.4 14.3 5 12 1.6Z" fill="#fff"/>
    <path d="M7.9 12.3l2.9 2.5-2.9 2.5M12.9 17.3h3.4" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <rect class="mark" width="24" height="24" mask="url(#prompt)"/>
</svg>
