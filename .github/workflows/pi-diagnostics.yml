name: Pi diagnostics

# Read-only look at the Pi from the self-hosted runner (the only host allowed
# through the Pi's firewall on the admin SSH port). Manual dispatch only —
# nothing here restarts, installs or writes anything.

on:
  workflow_dispatch:

permissions:
  # Read-only token: nothing here writes to the repository.
  contents: read

concurrency:
  # One self-hosted runner serves every job here, so overlapping runs queue
  # behind each other anyway. Naming the group makes that explicit and stops
  # a second run starting work the first is midway through.
  group: pi-access
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    env:
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_PORT: ${{ secrets.PI_PORT }}
      PI_USER: admin

    steps:
      - name: Inspect Pi
        run: |
          set -euo pipefail
          # Secrets, not variables: GitHub masks a secret as *** in these logs,
          # which are public, and the Pi's address is a home address. Rationale
          # in .github/workflows/README.md.
          if [ -z "${PI_HOST:-}" ] || [ -z "${PI_PORT:-}" ]; then
            echo "::error::The PI_HOST and PI_PORT secrets are not set."
            exit 1
          fi
          ssh -p "$PI_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" '
              set -uo pipefail

              echo "=================== uptime / boot ==================="
              uptime
              echo "last boot: $(who -b 2>/dev/null || true)"

              echo "=================== services ==================="
              for svc in cowrie cowrie-forwarder; do
                printf "%-20s %s\n" "$svc" "$(systemctl is-active $svc 2>&1 || true)"
              done
              echo
              systemctl status cowrie --no-pager -n 15 2>&1 | sed "s/^/  /" || true
              echo
              systemctl status cowrie-forwarder --no-pager -n 15 2>&1 | sed "s/^/  /" || true

              # Passwordless sudo is scoped to the deploy commands, so every
              # privileged read here is best-effort: plain first, then sudo -n
              # (non-interactive — fails fast instead of hanging on a prompt).
              try_read() {  # try_read <description> <command...>
                desc="$1"; shift
                if "$@" 2>/dev/null; then return 0; fi
                if sudo -n "$@" 2>/dev/null; then return 0; fi
                echo "  (cannot read $desc as $(whoami); needs sudo rights)"
              }

              echo "=================== forwarder journal (last 40) ==================="
              # stderr only carries POST status lines, never the bearer token.
              try_read "journal" journalctl -u cowrie-forwarder -n 40 --no-pager | sed "s/^/  /"

              echo "=================== cowrie log ==================="
              LOG=/home/cowrie/var/log/cowrie/cowrie.json
              try_read "cowrie.json stat" stat -c "  path=%n size=%s mtime=%y inode=%i" "$LOG"
              echo "  --- last line ---"
              try_read "cowrie.json" tail -n 1 "$LOG" | cut -c1-300 | sed "s/^/  /"
              echo "  --- log dir (rotation state) ---"
              try_read "log dir" ls -la --time-style=long-iso "$(dirname "$LOG")" | head -25 | sed "s/^/  /"

              echo "=================== forwarder state ==================="
              try_read "state.json" cat /var/lib/cowrie-forwarder/state.json | sed "s/^/  /"
              echo
              echo "  --- state dir ---"
              try_read "state dir" ls -la --time-style=long-iso /var/lib/cowrie-forwarder/ | sed "s/^/  /"
              echo "  --- dead-letter (tail) ---"
              try_read "deadletter" tail -n 3 /var/lib/cowrie-forwarder/deadletter.jsonl | cut -c1-300 | sed "s/^/  /"

              echo "=================== forwarder env (keys only, no values) ==================="
              try_read "env file" sudo -n grep -o "^[A-Z_]*=" /etc/cowrie-forwarder.env | sed "s/^/  /"

              echo "=================== clock / timezone ==================="
              echo "  pi local:  $(date)"
              echo "  pi as UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              timedatectl 2>/dev/null | sed "s/^/  /" || true
              echo "  cowrie service TZ: $(systemctl show cowrie -p Environment --value 2>/dev/null || echo unknown)"

              echo "=================== sudo rights (what deploys may do) ==================="
              sudo -n -l 2>&1 | sed "s/^/  /" || echo "  (cannot list sudo rights without a password)"

              echo "=================== connectivity to API ==================="
              curl -s -o /dev/null -w "  GET /health -> %{http_code} in %{time_total}s\n" \
                --max-time 20 https://hunajapannu.fi/api/public/cowrie/creds/unique-count || true

              echo "=================== disk ==================="
              df -h / /home 2>&1 | sed "s/^/  /" || true
            '
