name: Pi replay dead-letter

# Pushes batches parked in the Pi's deadletter.jsonl back through the
# ingestion API. Manual dispatch only — replays are at-least-once and the
# backend has no content dedupe, so only run this for batches that never
# got through.

on:
  workflow_dispatch:

permissions:
  # Read-only token: nothing here writes to the repository.
  contents: read

concurrency:
  # One self-hosted runner serves every job here, so overlapping runs queue
  # behind each other anyway. Naming the group makes that explicit and stops
  # a second run starting work the first is midway through.
  group: pi-access
  cancel-in-progress: false

jobs:
  replay:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    env:
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_PORT: ${{ secrets.PI_PORT }}
      PI_USER: admin

    steps:
      - name: Replay parked batches
        run: |
          set -euo pipefail
          # Secrets, not variables: GitHub masks a secret as *** in these logs,
          # which are public, and the Pi's address is a home address. Rationale
          # in .github/workflows/README.md.
          if [ -z "${PI_HOST:-}" ] || [ -z "${PI_PORT:-}" ]; then
            echo "::error::The PI_HOST and PI_PORT secrets are not set."
            exit 1
          fi
          ssh -p "$PI_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" '
              set -uo pipefail
              echo "--- before ---"
              ls -la --time-style=long-iso /var/lib/cowrie-forwarder/ | sed "s/^/  /"

              # The forwarder drains deadletter.jsonl on startup, and
              # "systemctl restart cowrie-forwarder" is a privilege the runner
              # already has (unlike "start" of the standalone oneshot unit).
              sudo systemctl restart cowrie-forwarder

              # Poll instead of sleeping a fixed 45s. Drain time scales with
              # the backlog, so any single number is either too long for a
              # small one or too short for a large one, and too short means
              # the run reports success while batches are still parked.
              echo "waiting for the dead-letter file to drain (up to 120s)..."
              for _ in $(seq 1 24); do
                [ -s /var/lib/cowrie-forwarder/deadletter.jsonl ] || break
                sleep 5
              done

              echo "--- replay output ---"
              journalctl -u cowrie-forwarder -n 60 --no-pager 2>&1 | sed "s/^/  /"

              echo "--- after ---"
              ls -la --time-style=long-iso /var/lib/cowrie-forwarder/ | sed "s/^/  /"
            '
