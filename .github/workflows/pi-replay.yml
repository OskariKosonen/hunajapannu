name: Pi replay dead-letter

# Pushes batches parked in the Pi's deadletter.jsonl back through the
# ingestion API. Manual dispatch only — replays are at-least-once and the
# backend has no content dedupe, so only run this for batches that never
# got through.

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: [self-hosted, linux]
    env:
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_PORT: ${{ secrets.PI_PORT }}
      PI_USER: admin

    steps:
      - name: Replay parked batches
        run: |
          set -euo pipefail
          # PI_HOST and PI_PORT are secrets, not variables and not literals. The Pi
          # sits on a residential line, so its address is the author's home IP
          # and the admin SSH port is non-standard; publishing either would hand
          # anyone reading this repo a precise target.
          #
          # Secrets rather than variables specifically because Actions logs are
          # public on a public repository. GitHub masks a secret as *** wherever
          # it appears in output; a variable is printed verbatim. One careless
          # echo is the difference, and the value is a home address.
          if [ -z "${PI_HOST:-}" ] || [ -z "${PI_PORT:-}" ]; then
            echo "::error::PI_HOST and PI_PORT repo variables are not set."
            exit 1
          fi
          ssh -p "$PI_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" '
              set -uo pipefail
              echo "--- before ---"
              ls -la --time-style=long-iso /var/lib/cowrie-forwarder/ | sed "s/^/  /"

              # The forwarder drains deadletter.jsonl on startup, and
              # "systemctl restart cowrie-forwarder" is a privilege the runner
              # already has (unlike "start" of the standalone oneshot unit).
              sudo systemctl restart cowrie-forwarder
              echo "waiting for drain..."
              sleep 45

              echo "--- replay output ---"
              journalctl -u cowrie-forwarder -n 60 --no-pager 2>&1 | sed "s/^/  /"

              echo "--- after ---"
              ls -la --time-style=long-iso /var/lib/cowrie-forwarder/ | sed "s/^/  /"
            '
