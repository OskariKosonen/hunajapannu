name: VPS diagnostics

# Read-only look at the VPS itself (the box this runner lives on). Manual
# dispatch only — nothing here restarts, installs or writes anything.
# Written to locate the old VirusTotal enrichment script, which stopped
# updating cowrie_files on 2026-07-25.
#
# No sudo: the runner's sudoers entry is an allowlist and find/grep are not
# on it. Everything below runs as the runner user, which is also the user
# any old cron-driven script would have run as.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    steps:
      - name: Locate the VT enrichment script
        run: |
          set -uo pipefail

          echo "=================== home dir ==================="
          ls -la /home/admin/ | head -40

          echo "=================== warm-cache.sh (the only cron entry) ==================="
          cat /home/admin/warm-cache.sh 2>/dev/null | head -40 || echo "(unreadable)"

          echo "=================== scripts mentioning virustotal (as runner user) ==================="
          grep -rl -i "virustotal" /home/admin \
            --include="*.py" --include="*.js" --include="*.sh" \
            --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null || echo "(none readable)"

          echo "=================== any vt-named files ==================="
          find /home/admin -maxdepth 3 \( -iname "*vt*" -o -iname "*virus*" -o -iname "*enrich*" \) \
            -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null || true

          echo "=================== pm2 (a dead pm2 app would explain the stop) ==================="
          pm2 ls || true
          pm2 jlist 2>/dev/null | python3 -c "
          import sys,json
          try: apps=json.load(sys.stdin)
          except Exception: sys.exit(0)
          for a in apps:
              e=a.get('pm2_env',{})
              print(f\"  {a.get('name')}  status={e.get('status')}  restarts={e.get('restart_time')}  script={e.get('pm_exec_path')}\")" || true
          exit 0

      - name: Print the VT backfill script, keys redacted
        # Explicit `shell: bash {0}`: the default is `bash -e {0}`, and a
        # `grep -c` returning zero matches was aborting this job before it
        # printed anything.
        shell: bash {0}
        run: |
          F=/home/admin/apps/cowrie-api/vt_backfill_frontend_min
          echo "=================== $F ==================="
          stat -c "modified: %y  size: %s" "$F"
          sed -E "s/[0-9a-f]{64}/<REDACTED-64HEX>/g; s/(api[_-]?key[^=:]*[=:]).*/\1 <REDACTED>/Ig" "$F"
          echo "=================== is there a scheduled runner for it? ==================="
          crontab -l | grep -i "vt\|virus" || echo "  cron: no VT entry (only warm-cache.sh)"
          systemctl list-timers --all --no-pager | grep -i "vt\|virus" || echo "  systemd: no VT timer"
          echo "=================== venv python ==================="
          ls /home/admin/apps/cowrie-api/venv/bin/ 2>/dev/null | head
          /home/admin/apps/cowrie-api/venv/bin/python --version 2>/dev/null
          /home/admin/apps/cowrie-api/venv/bin/pip list 2>/dev/null | head -15
          exit 0
