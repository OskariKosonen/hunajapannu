name: VPS diagnostics

# Read-only look at the VPS itself (the box this runner lives on). Manual
# dispatch only — nothing here restarts, installs or writes anything.
# Written to locate the old VirusTotal enrichment script, which stopped
# updating cowrie_files on 2026-07-25.
#
# No sudo: the runner's sudoers entry is an allowlist and find/grep are not
# on it. Everything below runs as the runner user, which is also the user
# any old cron-driven script would have run as.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    steps:
      - name: Locate the VT enrichment script
        run: |
          set -uo pipefail

          echo "=================== home dir ==================="
          ls -la /home/admin/ | head -40

          echo "=================== warm-cache.sh (the only cron entry) ==================="
          cat /home/admin/warm-cache.sh 2>/dev/null | head -40 || echo "(unreadable)"

          echo "=================== scripts mentioning virustotal (as runner user) ==================="
          grep -rl -i "virustotal" /home/admin \
            --include="*.py" --include="*.js" --include="*.sh" \
            --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null || echo "(none readable)"

          echo "=================== any vt-named files ==================="
          find /home/admin -maxdepth 3 \( -iname "*vt*" -o -iname "*virus*" -o -iname "*enrich*" \) \
            -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null || true

          echo "=================== pm2 (a dead pm2 app would explain the stop) ==================="
          pm2 ls || true
          pm2 jlist 2>/dev/null | python3 -c "
          import sys,json
          try: apps=json.load(sys.stdin)
          except Exception: sys.exit(0)
          for a in apps:
              e=a.get('pm2_env',{})
              print(f\"  {a.get('name')}  status={e.get('status')}  restarts={e.get('restart_time')}  script={e.get('pm_exec_path')}\")" || true
          exit 0

      - name: Inspect the old app dir and how VT was run
        run: |
          set -uo pipefail
          echo "=================== /home/admin/apps ==================="
          find /home/admin/apps -maxdepth 3 -type f 2>/dev/null | head -40
          echo "=================== cowrie-api dir ==================="
          ls -la /home/admin/apps/cowrie-api/ 2>/dev/null || true
          ls -la /home/admin/apps/cowrie-api/vt_backfill_frontend_min 2>/dev/null || true

          echo "=================== any file mentioning virustotal (no extension filter) ==================="
          grep -rl -i "virustotal" /home/admin/apps 2>/dev/null | head -10

          echo "=================== VT commands from shell history (redacted) ==================="
          grep -i "vt\|virustotal" /home/admin/.bash_history 2>/dev/null \
            | sed -E 's/[0-9a-f]{64}/<REDACTED-64HEX>/g' | tail -25 || echo "(none)"

          echo "=================== is a VT key present in any env file? (presence only) ==================="
          for f in /home/admin/.env /home/admin/hunajapannu/.env /home/admin/hunajapannu/backend/.env \
                   /home/admin/apps/cowrie-api/.env /home/admin/ecosystem.config.js; do
            [ -f "$f" ] && echo "  $f: $(grep -c -i 'vt\|virustotal' "$f" 2>/dev/null) vt-ish lines"
          done
          exit 0

      - name: Print the VT script, keys redacted
        run: |
          set -uo pipefail
          hits=$(grep -rl -i "virustotal" /home/admin/apps 2>/dev/null | head -3)
          for f in $hits; do
            echo "=================== $f ==================="
            stat -c 'modified: %y  size: %s' "$f"
            sed -E 's/[0-9a-f]{64}/<REDACTED-64HEX>/g; s/(api[_-]?key[^=:]*[=:]).*/\1 <REDACTED>/Ig' "$f" | head -160
          done
          [ -n "$hits" ] || echo "(nothing under /home/admin/apps mentions virustotal)"
          exit 0
