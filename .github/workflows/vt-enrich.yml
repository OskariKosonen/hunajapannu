name: VirusTotal enrichment

# The dashboard shows a VirusTotal column for every captured sample, but the
# thing that filled it was a script on the VPS that someone ran by hand. It
# stopped on 2026-07-25 and every sample after that had an empty verdict while
# the column carried on being displayed.
#
# This runs it on a schedule instead. Free-tier VirusTotal allows 4 lookups a
# minute, so a run is deliberately bounded: 40 samples takes ~10 minutes and
# the backlog drains over a few runs rather than one long job.

on:
  schedule:
    # Every 6 hours. New samples are rare (264 in nine months), so this is
    # about draining a backlog promptly, not keeping up with volume.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Max samples to look up this run"
        required: false
        default: "40"

permissions:
  # Read-only token: nothing here writes to the repository.
  contents: read

concurrency:
  # One self-hosted runner serves every job here, so overlapping runs queue
  # behind each other anyway. Naming the group makes that explicit and stops
  # a second run starting work the first is midway through.
  group: vt-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Enrich pending samples
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          PGHOST: localhost
          PGDATABASE: cowrie_db
          PGUSER: ${{ secrets.PGUSER || 'cowrie_user' }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          VT_BATCH: ${{ github.event.inputs.batch || '40' }}
        run: |
          set -euo pipefail

          if [ -z "${VT_API_KEY}" ]; then
            echo "::warning::VT_API_KEY secret is not set — skipping. Add it in"
            echo "::warning::Settings → Secrets → Actions to enable enrichment."
            exit 0
          fi
          if [ -z "${PGPASSWORD}" ]; then
            echo "::warning::PGPASSWORD secret is not set — skipping."
            exit 0
          fi

          # --clear, and no pip self-upgrade. Both matter.
          #
          # This ran `pip install --upgrade pip` first, which makes pip
          # upgrade itself in place — and something interrupted that on
          # 2026-09-16, leaving bin/pip importable but gutted:
          #
          #   ModuleNotFoundError: No module named 'pip._internal.cli.main'
          #
          # `python3 -m venv` on a directory that already exists does not
          # re-bootstrap pip, so the broken venv survived every later run and
          # the job failed identically ~24 times over six days, always within
          # 35 seconds, never reaching the script. --clear rebuilds the
          # environment each run, which makes the job self-healing rather than
          # permanently poisoned by one bad moment.
          #
          # The pip upgrade itself was never needed: pip 24.0 installs both
          # dependencies fine, and dropping it removes the only step that can
          # corrupt the venv.
          python3 -m venv --clear /tmp/vt-venv
          /tmp/vt-venv/bin/pip install --quiet psycopg2-binary requests
          /tmp/vt-venv/bin/python tools/vt_enrich.py

      - name: Report coverage
        if: always()
        env:
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: |
          set -uo pipefail
          [ -z "${PGPASSWORD}" ] && exit 0
          PSQL=(psql -h localhost -U "${{ secrets.PGUSER || 'cowrie_user' }}" -d cowrie_db -qtA)

          "${PSQL[@]}" -c "
            SELECT 'samples: ' || COUNT(DISTINCT sha256)
                 || ' | enriched: ' || COUNT(DISTINCT sha256) FILTER (WHERE vt_last_fetched IS NOT NULL)
                 || ' | pending: '  || COUNT(DISTINCT sha256) FILTER (WHERE vt_last_fetched IS NULL)
              FROM cowrie_files
             WHERE sha256 ~ '^[A-Fa-f0-9]{64}\$'" || true

          # The broken venv above went unnoticed for six days because a red X
          # on a scheduled job is easy to scroll past. Staleness is the thing
          # that actually matters, so say it out loud. A run every 6h means
          # anything past two days has missed several attempts.
          stale=$("${PSQL[@]}" -c "
            SELECT COALESCE(EXTRACT(DAY FROM now() - MAX(vt_last_fetched))::int, 999)
              FROM cowrie_files" 2>/dev/null || echo 0)
          if [ "${stale:-0}" -ge 2 ]; then
            echo "::warning::No VirusTotal verdict has been recorded for ${stale} days."
          fi
          exit 0
