name: Ingest watchdog

# On 2026-08-11 ingestion stopped and nothing noticed for four days: both Pi
# services reported active, the deploy was green, the API answered every
# request, and the dashboard loaded. The only symptom was data that was not
# arriving. This job watches for exactly that.
#
# It runs on GitHub's hosted runners on purpose — the self-hosted runner lives
# on the same Pi as the backend, so it cannot report that the Pi is down.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Never queue these up behind each other.
concurrency:
  group: ingest-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe ingest freshness
        id: probe
        run: |
          set -uo pipefail

          body=$(curl -fsS --max-time 30 https://hunajapannu.fi/api/health) || {
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            echo "detail=The API did not respond to /api/health." >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "$body"

          # Not `.ingestStale // true` — jq's // treats false as empty, so a
          # healthy `false` would fall through to the default and alert on
          # every run. Explicitly distinguish false from missing.
          stale=$(printf '%s' "$body" | jq -r 'if .ingestStale == false then "false" else "true" end')
          age=$(printf '%s' "$body" | jq -r '.lastEventAgeSeconds // "unknown"')
          last=$(printf '%s' "$body" | jq -r '.lastEventAt // "never"')
          db=$(printf '%s' "$body" | jq -r '.db // "unknown"')

          skewed=$(printf '%s' "$body" | jq -r 'if .clockSkewed == true then "true" else "false" end')
          skew=$(printf '%s' "$body" | jq -r '.clockSkewSeconds // 0')

          # Same false-vs-missing care as ingestStale above. An older API that
          # does not report disk at all yields "false" here, which is correct:
          # absence of the field is not evidence of a full volume.
          disklow=$(printf '%s' "$body" | jq -r 'if .diskLow == true then "true" else "false" end')
          freemb=$(printf '%s' "$body" | jq -r '.diskFreeMb // "unknown"')
          usedpct=$(printf '%s' "$body" | jq -r '.diskUsedPercent // "unknown"')

          if [ "$db" != "connected" ]; then
            echo "status=db" >> "$GITHUB_OUTPUT"
            echo "detail=The API is up but reports the database as '$db'." >> "$GITHUB_OUTPUT"
          elif [ "$skewed" = "true" ]; then
            echo "status=skew" >> "$GITHUB_OUTPUT"
            echo "detail=Events are timestamped $((skew / 60)) minutes in the future — the sensor's clock or timezone disagrees with the server." >> "$GITHUB_OUTPUT"
          elif [ "$stale" = "true" ]; then
            mins=$([ "$age" = "unknown" ] && echo unknown || echo $((age / 60)))
            echo "status=stale" >> "$GITHUB_OUTPUT"
            echo "detail=No events ingested for ${mins} minutes (last event: ${last})." >> "$GITHUB_OUTPUT"
          elif [ "$disklow" = "true" ]; then
            # Ranked below the others deliberately: a stopped feed is already
            # losing data, a filling disk is going to. Both want an issue, but
            # if somehow both are true the feed is the more urgent headline.
            echo "status=disk" >> "$GITHUB_OUTPUT"
            echo "detail=Only ${freemb} MB free on the database volume (${usedpct}% used). A full disk crashed PostgreSQL on 2026-09-22; see db/README.md for what can be reclaimed." >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "detail=Last event ${age}s ago, ${freemb} MB free." >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        if: steps.probe.outputs.status == 'ok'
        run: echo "✅ ${{ steps.probe.outputs.detail }}"

      # Notify once per incident, not once per poll. The first run of this
      # watchdog against a real (and still unfixed) clock skew produced 17
      # failed runs and 19 identical issue comments overnight — which is how
      # you teach someone to ignore their alerts. A persistent condition is
      # tracked by the open issue; only a new or changed condition is loud.
      - name: Open or update alert issue
        if: steps.probe.outputs.status != 'ok'
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ steps.probe.outputs.status }}';
            // toJSON already yields a quoted JS string literal — assign it
            // directly rather than nesting it in a template literal, which
            // would leave the quotes visible in the issue text.
            const detail = ${{ toJSON(steps.probe.outputs.detail) }};

            // Title and guidance follow the condition; "ingestion has
            // stopped" on a clock-skew alert sends you hunting the wrong bug.
            const CONDITIONS = {
              stale: {
                title: '🚨 Honeypot ingestion has stopped',
                steps: [
                  'Run the `Pi diagnostics` workflow — service states, forwarder journal, dead-letter file',
                  'Check the forwarder journal for `403 error code: 1010` (Cloudflare blocking the uploads)',
                  'Check whether Cowrie itself is still writing to `cowrie.json`',
                ],
              },
              skew: {
                title: '🚨 Honeypot event timestamps are skewed',
                steps: [
                  'Compare `date -u` on the Pi with the `timestamp` field from `/api/health`',
                  'Cowrie writes its local time labelled `Z`; running it under `TZ=UTC` keeps stored events in real UTC',
                  'Note that skew hides a stopped feed — future-dated events read as fresh',
                ],
              },
              db: {
                title: '🚨 Honeypot database unreachable',
                steps: [
                  'Check Postgres is running on the Pi and accepting connections',
                  'Check `pm2 logs cowrie-api` for connection errors',
                ],
              },
              unreachable: {
                title: '🚨 Honeypot API unreachable',
                steps: [
                  'Check the Pi is online and nginx is serving',
                  'Check `pm2 describe cowrie-api`',
                ],
              },
            };
            const condition = CONDITIONS[status] || CONDITIONS.stale;

            const now = new Date().toISOString();
            // Machine-readable marker so a later run can tell "same condition
            // still happening" from "the condition changed".
            const marker = (s) => `<!-- watchdog-status:${s} -->`;

            const renderBody = (firstSeen) => [
              marker(status),
              `**Problem:** ${detail}`,
              '',
              `First detected: ${firstSeen}`,
              `Last checked:   ${now}  (check: \`${status}\`)`,
              '',
              'Where to look:',
              ...condition.steps.map((s, i) => `${i + 1}. ${s}`),
              '',
              '_Raised automatically by `.github/workflows/ingest-watchdog.yml`._',
              '_While this stays open, repeat detections update it quietly instead of failing every run; it closes itself once the check passes._',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-watchdog',
            });

            if (open.length === 0) {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: condition.title, body: renderBody(now), labels: ['ingest-watchdog'],
              });
              core.setFailed(`${detail} (opened #${issue.number})`);
              return;
            }

            const issue = open[0];
            const previous = (issue.body || '').match(/<!-- watchdog-status:(\w+) -->/)?.[1];
            const firstSeen = (issue.body || '').match(/First detected: (\S+)/)?.[1] || now;

            // Editing the body does not notify anyone, so the issue can carry
            // a fresh "last checked" without pinging on every poll.
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              title: condition.title,
              body: renderBody(firstSeen),
            });

            if (previous === status) {
              core.info(`${detail}\nAlready tracked in #${issue.number} since ${firstSeen} — not re-alerting.`);
              return;
            }

            // The condition genuinely changed (skew that became a stopped
            // feed, say). That is new information, so speak up again.
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `Condition changed from \`${previous || 'unknown'}\` to \`${status}\`: ${detail}`,
            });
            core.setFailed(`Condition changed to ${status}: ${detail} (see #${issue.number})`);

      - name: Close alert issue on recovery
        if: steps.probe.outputs.status == 'ok'
        uses: actions/github-script@v8
        with:
          script: |
            const detail = ${{ toJSON(steps.probe.outputs.detail) }};
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-watchdog',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — ${detail}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
