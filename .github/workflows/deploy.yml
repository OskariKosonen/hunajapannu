name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Lint, build and a real boot-against-Postgres smoke test, on hosted
  # runners, before anything touches the Pi.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: [self-hosted, linux]
    env:
      # The Pi sits on a dynamic residential IP; keep it in a repo variable so
      # an address change is a settings update, not a commit.
      PI_HOST: ${{ vars.PI_HOST || 'REDACTED' }}
      PI_PORT: "22222"
      PI_USER: admin
      REPO_DIR: /home/admin/hunajapannu
      WEB_ROOT: /var/www/hunajapannu.fi/html

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy backend
        working-directory: ${{ env.REPO_DIR }}
        run: |
          set -euo pipefail
          git fetch --all

          # Remember what was running so the health check can put it back.
          PREV_SHA=$(git rev-parse HEAD)
          echo "PREV_SHA=$PREV_SHA" >> "$GITHUB_ENV"
          echo "Currently deployed: $PREV_SHA"

          git reset --hard origin/main
          echo "Deploying:          $(git rev-parse HEAD)"

          cd backend && npm ci && cd ..

          echo "Applying migrations"
          # Runs each migration once, records it in schema_migrations, and
          # fails the deploy if one errors. This used to be a loop ending in
          # `|| echo "(skipped/failed)"`, which is how migration 006 aborted
          # on 2026-08-12 while the deploy went green and /top-asn served an
          # empty aggregate table for days.
          #
          # pm2 has not restarted yet at this point, so the API is still
          # serving the previous revision from memory. Put the working tree
          # back to match it rather than leaving the two out of step until
          # someone restarts pm2 by hand.
          if ! ./db/apply-migrations.sh sudo -u postgres psql -d cowrie_db; then
            echo "::error::Migration failed; restoring the working tree to $PREV_SHA. The running API was not restarted and is unaffected."
            git reset --hard "$PREV_SHA"
            (cd backend && npm ci)
            exit 1
          fi

          pm2 restart cowrie-api

      - name: Backend health check
        working-directory: ${{ env.REPO_DIR }}
        run: |
          set -uo pipefail
          # The app loads two MaxMind databases before it starts listening,
          # and on a loaded box that has taken well over the old 25s window —
          # a deploy failed on 2026-08-11 with the backend coming up ~70s
          # after pm2 reported "online". Allow ~2 minutes.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health; then
              echo "  backend healthy"; exit 0
            fi
            echo "  waiting for backend... ($i)"; sleep 2
          done

          echo "::error::Backend did not become healthy; rolling back to $PREV_SHA"
          pm2 describe cowrie-api || true
          pm2 logs cowrie-api --nostream --lines 100 || true

          # Roll the code back. Migrations are deliberately NOT reverted:
          # these are additive (new tables, columns, indexes, triggers) and
          # the previous revision runs fine against the newer schema, whereas
          # a half-understood down-migration on live data is how you turn a
          # failed deploy into a lost database.
          echo "--- rolling back ---"
          git reset --hard "$PREV_SHA"
          (cd backend && npm ci)
          pm2 restart cowrie-api

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health; then
              echo "::warning::Deploy failed and was rolled back to $PREV_SHA. The site is up on the previous revision; the schema is left at the newer version."
              exit 1
            fi
            sleep 2
          done
          echo "::error::Rollback to $PREV_SHA also failed to come up. The API is down."
          exit 1

      - name: Deploy frontend
        working-directory: ${{ env.REPO_DIR }}/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          sudo rsync -a --delete dist/ "${WEB_ROOT}/"

      - name: Deploy forwarder to Pi
        run: |
          set -euo pipefail
          # The Pi is on a residential connection and can be offline or on a
          # new IP; that must not block backend/frontend deploys. Skip with a
          # visible warning instead of failing the whole run.
          if ! ssh -p "$PI_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
               -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" true 2>/dev/null; then
            echo "::warning::Pi at $PI_HOST:$PI_PORT is unreachable; skipped forwarder deploy. Update the PI_HOST repo variable if its address changed, then re-run."
            exit 0
          fi
          ssh -p "$PI_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$PI_USER@$PI_HOST" '
              set -euo pipefail
              cd ~/hunajapannu || { echo "repo not cloned on Pi at ~/hunajapannu"; exit 1; }
              git fetch --all && git reset --hard origin/main
              sudo install -m 0755 forwarder/forwarder.py /opt/cowrie-forwarder/forwarder.py
              sudo install -m 0755 forwarder/replay_deadletter.py /opt/cowrie-forwarder/replay_deadletter.py
              sudo install -m 0644 forwarder/cowrie-forwarder.service /etc/systemd/system/cowrie-forwarder.service
              sudo install -m 0644 forwarder/cowrie-forwarder-replay.service /etc/systemd/system/cowrie-forwarder-replay.service
              sudo systemctl daemon-reload
              sudo systemctl restart cowrie-forwarder
              systemctl is-active cowrie-forwarder
            '

      - name: Done
        run: echo "Deploy complete."