name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    env:
      PI_HOST: REDACTED
      PI_PORT: "22222"
      PI_USER: admin
      REPO_DIR: /home/admin/hunajapannu
      WEB_ROOT: /var/www/hunajapannu.fi/html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend
        working-directory: ${{ env.REPO_DIR }}
        run: |
          set -euo pipefail
          git fetch --all
          git reset --hard origin/main
          cd backend
          npm ci
          cd ..
          echo "Applying migrations"
          shopt -s nullglob
          migs=(db/migrations/*.sql)
          if [ ${#migs[@]} -eq 0 ]; then
            echo "  (no migration files found)"
          else
            for f in "${migs[@]}"; do
              echo "  - $f"
              sudo -u postgres psql -d cowrie_db -v ON_ERROR_STOP=1 -f "$f" \
                || echo "  (skipped/failed: $f — review if unexpected)"
            done
          fi
          pm2 restart cowrie-api

      - name: Backend health check
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:3001/health; then
              echo "  backend healthy"; exit 0
            fi
            echo "  waiting for backend... ($i)"; sleep 2
          done
          echo "  backend did not become healthy"; exit 1

      - name: Deploy frontend
        working-directory: ${{ env.REPO_DIR }}/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          sudo rsync -a --delete dist/ "${WEB_ROOT}/"

      - name: Deploy forwarder to Pi
        run: |
          set -euo pipefail
          ssh -p "$PI_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$PI_USER@$PI_HOST" '
              set -euo pipefail
              cd ~/hunajapannu || { echo "repo not cloned on Pi at ~/hunajapannu"; exit 1; }
              git fetch --all && git reset --hard origin/main
              sudo install -m 0755 forwarder/forwarder.py /opt/cowrie-forwarder/forwarder.py
              sudo install -m 0644 forwarder/cowrie-forwarder.service /etc/systemd/system/cowrie-forwarder.service
              sudo systemctl daemon-reload
              sudo systemctl restart cowrie-forwarder
              systemctl is-active cowrie-forwarder
            '

      - name: Done
        run: echo "Deploy complete."